<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05060f;--fg:#eaf0ff;--mut:#a5b1da;--a:#6fe3ff;--b:#ff7ad9;--glass:rgba(10,14,38,.68);--ln:rgba(160,180,255,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--fg);background:var(--glass);border:1px solid var(--ln);border-radius:999px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
button:hover:not(:disabled){border-color:var(--a);box-shadow:0 0 18px var(--a);transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:default}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;gap:8px;padding:10px 12px}
#bar .sp{flex:1}
.scr{position:absolute;inset:0;display:none;overflow:auto;padding:70px 16px 28px;animation:in .7s}
.scr.on{display:block}@keyframes in{from{opacity:0;transform:translateY(24px) scale(.98)}}
.wrap{max-width:980px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--ln);border-radius:22px;padding:18px;backdrop-filter:blur(10px);box-shadow:0 10px 50px rgba(0,0,0,.4)}
h1{font-size:clamp(34px,7vw,74px);line-height:1.05;margin:.1em 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px var(--a)}
h2{margin:.2em 0}p{color:var(--mut);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:16px 0}
.cx{cursor:pointer;text-align:left;border-radius:20px;padding:16px;transition:.3s}
.cx:hover{transform:perspective(600px) rotateX(6deg) translateY(-6px);border-color:var(--a);box-shadow:0 0 30px var(--a)}
.cx i{font-style:normal;font-size:38px;display:block}.cx b{display:block;margin:6px 0 4px}.cx small{color:var(--mut)}
.av{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;font-size:28px;flex:none;box-shadow:0 0 22px currentColor;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.crew{display:flex;flex-wrap:wrap;gap:12px}.crew>div{flex:1 1 250px;display:flex;gap:12px;align-items:center}
.crew small{color:var(--mut);display:block}
#nar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:12px 0}
canvas.pix{image-rendering:pixelated;border:2px solid var(--ln);border-radius:12px;background:#000}
canvas{touch-action:none;max-width:100%}
.cap{text-align:center;color:var(--mut);font-size:.9em;margin-top:6px}
.opt{display:block;width:100%;margin:8px 0;text-align:left;border-radius:14px}
.ok{border-color:#5dffa5!important;box-shadow:0 0 18px #5dffa5}.no{border-color:#ff5d7a!important}
.meter{height:16px;border-radius:9px;background:#0008;overflow:hidden;border:1px solid var(--ln)}.meter>div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle,#0000 20%,#000c)}
@keyframes fi{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}#intro .t{opacity:0;animation:fi 1.6s forwards}#intro .t:nth-child(2){animation-delay:1.4s}#intro .t:nth-child(3){animation-delay:2.8s}#intro button{opacity:0;animation:fi 1s 3.6s forwards}
.lb{position:fixed;left:0;right:0;height:50vh;background:#000;z-index:31;animation:lb 3.5s 1s forwards;pointer-events:none}.lb.t{top:0}.lb.b{bottom:0}@keyframes lb{to{height:7vh}}
#intro.off,.lb.off{display:none}
.stars{color:#ffd54a;font-size:1.4em}
</style></head><body>
